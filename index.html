<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ペンギンマップ — 日本でペンギンに会える場所</title>
<meta name="theme-color" content="#0f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ペンギンマップ">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="bar">
  <h1>🐧 ペンギンマップ</h1>
  <div class="stats" id="stats"></div>
  <button class="btn ghost" id="listToggle" aria-pressed="false">一覧</button>
</header>

<div class="filters">
  <input id="search" type="search" placeholder="施設名・都道府県で検索" autocomplete="off">
  <label class="chk"><input type="checkbox" id="onlyVisited"> 行った所</label>
  <label class="chk"><input type="checkbox" id="onlyUnvisited"> 未訪問</label>
  <div class="chips" id="speciesChips"></div>
</div>

<main>
  <div id="map"></div>
  <aside id="list" class="list" hidden></aside>
</main>

<section id="sheet" class="sheet" aria-hidden="true">
  <button class="sheet-close" id="sheetClose" aria-label="閉じる">×</button>
  <div id="sheetBody"></div>
</section>

<div id="lightbox" class="lightbox" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
<script src="data/species.js"></script>
<script src="data/facilities.js"></script>
<script src="data/prefs.js"></script>
<script src="js/app.js"></script>
<script>
  // 新しい版を公開したら、アプリを開いたときに自動で切り替える
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update(); });
    });
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (hadController && !reloaded) { reloaded = true; location.reload(); }
    });
  }
</script>
</body>
</html>
